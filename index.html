
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSG Software</title>
    <link rel="icon" type="image/x-icon" href="lsg.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>LSG Software</h1>
        <p>Coming soon.</p>

        <div class="links">
            <a href="https://github.com/leordeansg">GitHub</a>
            <a href="https://www.linkedin.com/in/leordeansg/">LinkedIn</a>
            <button class="discord-link" onclick="document.getElementById('discord').showModal()">
                Discord
            </button>
        </div>
    </main>

    <dialog id="discord">
        <h3>Discord</h3>
        <p>gabe.html</p>

        <div class="dialog-buttons">
            <button onclick="copyDiscord()">Copy username</button>
            <button onclick="document.getElementById('discord').close()">Close</button>
        </div>
    </dialog>

    <script>
        function copyDiscord() {
            navigator.clipboard.writeText("gabe.html").then(() => {
                document.querySelector(".dialog-buttons button").textContent = "Copied!";
            });
        }
    </script>
</body>
</html>
